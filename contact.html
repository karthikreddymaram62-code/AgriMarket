<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact | AgriMarket</title>
<meta name="description" content="Contact AgriMarket support.">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/responsive.css">
</head>
<body data-page="contact">
<main class="container section-sm">
  <div class="bcrumbs"><a href="index.html">Home</a> / <b>Contact</b></div>
  <div class="grid grid-2" style="gap:28px">
    <div><span class="eyebrow">✉️ Say hello</span><h1>We'd love to hear from you</h1>
      <p class="muted">Support in Telugu, Hindi & English — Mon–Sat, 9am–7pm.</p>
      <div class="card card-pad" style="margin-top:14px">
        <p>📞 <b>1800-123-456</b> <span class="small muted">(TBD — demo)</span><br>✉️ <b>hello@agrimarket.in</b><br>📍 Hyderabad, Telangana, India</p>
        <div class="flex wrap"><span class="badge b-green">✔ Avg reply: 3 hrs</span><span class="badge b-gold">★ 4.8 support rating</span></div>
      </div></div>
    <div class="card card-pad"><form id="ct-form" novalidate>
      <div class="form-row"><div class="field"><label>Name <span class="req">*</span></label><input class="input" name="name" required></div>
      <div class="field"><label>Email <span class="req">*</span></label><input class="input" name="email" type="email" required></div></div>
      <div class="field"><label>Topic</label><select class="input" name="subject"><option>Order help</option><option>Sell as farmer</option><option>Bulk enquiry</option><option>Partnership</option><option>Other</option></select></div>
      <div class="field"><label>Message <span class="req">*</span></label><textarea class="input" name="message" required placeholder="How can we help?"></textarea></div>
      <button class="btn btn-primary btn-block">Send message ✉️</button>
    </form></div>
  </div>
</main>
<script src="js/data.js"></script><script src="js/services.js"></script><script src="js/common.js"></script><script src="js/customer.js"></script>
</body>
</html>
