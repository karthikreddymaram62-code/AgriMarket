<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login | AgriMarket</title>
<meta name="description" content="Login to your AgriMarket demo account.">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/responsive.css">
</head>
<body data-page="login">
<main class="container section">
  <div class="grid grid-2" style="align-items:center;gap:36px">
    <div><span class="eyebrow">👋 Welcome back</span>
      <h1>Login to AgriMarket</h1>
      <p class="muted">Demo authentication (localStorage) — clearly separated from production auth.</p>
      <div class="card card-pad" style="margin-top:16px"><b>⚡ One-click demo accounts</b>
        <div class="flex wrap" style="margin-top:10px">
          <button class="btn btn-ghost btn-sm fill-demo" data-e="customer@agrimarket.in" data-p="customer123">🧑 Customer</button>
          <button class="btn btn-ghost btn-sm fill-demo" data-e="farmer@agrimarket.in" data-p="farmer123">🧑‍🌾 Farmer</button>
          <button class="btn btn-ghost btn-sm fill-demo" data-e="admin@agrimarket.in" data-p="admin123">🛠️ Admin</button>
        </div></div></div>
    <div class="card card-pad">
      <form id="login-form" novalidate>
        <div class="field"><label>Email <span class="req">*</span></label><input class="input" id="l-email" type="email" required placeholder="you@example.com"><span class="err-msg">Enter a valid email</span></div>
        <div class="field"><label>Password <span class="req">*</span></label><input class="input" id="l-pass" type="password" required placeholder="••••••••"><span class="err-msg">Enter password</span></div>
        <button class="btn btn-primary btn-block">Login →</button>
        <p class="small center" style="margin-top:12px">New here? <a href="register.html"><b>Create free account</b></a></p>
      </form>
    </div>
  </div>
</main>
<script src="js/data.js"></script><script src="js/services.js"></script><script src="js/common.js"></script><script src="js/auth.js"></script>
</body>
</html>
